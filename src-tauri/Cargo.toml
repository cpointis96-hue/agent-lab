[package]
name = "agent-lab"
version = "0.1.0"
description = "A local-first desktop application for learning AI agent architectures"
authors = ["Agent Lab"]
edition = "2021"

[lib]
name = "agent_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
